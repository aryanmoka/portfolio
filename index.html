  <body>

    <!--
      Netlify scans the built static HTML for forms at deploy time to
      provision a submission endpoint. The real form is rendered by React
      in Contact.tsx and POSTs to this same form name — this hidden copy
      exists purely so Netlify's bot can detect it during the build.
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
